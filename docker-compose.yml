# Local development infrastructure only.
# The app itself runs with `npm run dev` inside frontend/ourRecipesFront.
#
# Matching DATABASE_URL for .env / .env.local:
#   DATABASE_URL=postgresql://ourrecipes:ourrecipes@localhost:5432/ourrecipes
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ourrecipes
      POSTGRES_PASSWORD: ourrecipes
      POSTGRES_DB: ourrecipes
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
