<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'">
<title>בדיקת תמלול במטבח</title>
<style>
*{box-sizing:border-box}body{max-width:36rem;margin:auto;padding:1.25rem;background:#faf9f4;color:#182c21;font:18px/1.5 system-ui,sans-serif}h1{font-size:1.65rem}h2{font-size:1.1rem}button,select,input{font:inherit;max-width:100%;padding:.45rem;border-radius:.35rem}button{background:#205341;color:white;border:0;margin:.25rem}button:disabled{background:#dfe4df;color:#505c54}p{margin:.6rem 0}label{display:block;margin:.5rem 0}progress{width:100%}output{display:block;min-height:1.4em}
</style>
<h1>בדיקת תמלול במטבח</h1>
<p>אותה הקלטה, עם מצרכי המתכון ובלעדיהם. הקול והתמלילים נשארים בלשונית.</p>
<button id="load" disabled>טעינת מודל ללשונית (כ־72 מ״ב)</button><button id="cancel" disabled>ביטול ההורדה</button><button id="erase" disabled>מחיקה מהלשונית</button>
<progress id="progress" hidden></progress>
<label>מתכון <select id="recipe" disabled><option value="salad">סלט עדשים</option><option value="cookies">עוגיות קקאו</option></select></label>
<p id="ingredients"></p>
<button id="start" disabled>הקלטה</button><button id="stop" disabled>סיום ותמלול</button>
<label>או לבחור קובץ שמע קצר <input id="file" type="file" accept="audio/*" disabled></label>
<p id="status" role="status">בודק תמיכה…</p>
<h2>עם רמזי המתכון</h2><output id="hinted"></output>
<h2>בלי רמזים</h2><output id="plain"></output>
<p id="timing"></p><a href="NOTICE.txt">ייחוס ורישיונות</a>
