<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אין חיבור לאתר</title><body><h1>אין חיבור לאתר המתכונים</h1><p>זהו חיבור פיתוח לאתר. התראות שכבר נקבעו במכשיר אינן דורשות אינטרנט. כדי לטעון שוב את האתר, התחברו לרשת ופתחו מחדש את האפליקציה.</p></body></html>
